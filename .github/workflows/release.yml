name: Auto Version Bump

on:
  push:
    branches:
      - main # Скрипт срабатывает, когда изменения попадают в ветку main
    paths-ignore: # Страховка от зацикливания; со встроенным GITHUB_TOKEN не требуется, см. комментарий ниже
      - 'pyproject.toml'
      - 'README.md'

jobs:
  bump-and-docs:
    runs-on: ubuntu-latest

    # Встроенному токену нужно право записи, иначе push в main не пройдёт
    permissions:
      contents: write

    steps:
    # 1. Скачиваем код репозитория
    # Токен не указан намеренно: actions/checkout берёт встроенный GITHUB_TOKEN.
    # Пуш от него не перезапускает workflow, поэтому paths-ignore выше и [skip ci]
    # в сообщении коммита стали избыточны и оставлены только как страховка на
    # случай возврата к персональному токену.
    - name: Checkout code
      uses: actions/checkout@v4

    # 2. Настраиваем Python окружение
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    # 3. Скрипт автоматизации версий
    - name: Run automation script
      run: |
        python -c "
        import re

        # Авто-обновление версии в pyproject.toml (повышаем патч-версию, например 1.0.0 -> 1.0.1)
        with open('pyproject.toml', 'r') as f:
            content = f.read()

        version_match = re.search(r'version = \"(\d+)\.(\d+)\.(\d+)\"', content)
        if version_match:
            major, minor, patch = map(int, version_match.groups())
            new_patch = patch + 1
            new_version = f'{major}.{minor}.{new_patch}'
            content = re.sub(r'version = \"\d+\.\d+\.\d+\"', f'version = \"{new_version}\"', content)
            with open('pyproject.toml', 'w') as f:
                f.write(content)
            print(f'New version calculated: {new_version}')
        else:
            print('Version string not found in pyproject.toml, nothing to bump')
        "

    # 4. Сохраняем изменения и отправляем обратно в main
    - name: Commit and Push changes
      run: |
        git config --global user.name "github-actions[bot]"
        git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"

        git add pyproject.toml
        # Если версию поднять не удалось, коммитить нечего — выходим без ошибки
        if git diff --staged --quiet; then
          echo "Нет изменений для коммита"
          exit 0
        fi
        git commit -m "chore: auto-bump version [skip ci]"
        git push origin main
